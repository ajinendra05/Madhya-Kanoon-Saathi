[project]
name = "madhya-kanoon-saathi"
version = "0.1.0"
description = "Hindi-first, citation-verified legal-information assistant for Madhya Pradesh + central Indian laws."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# Groups per DEC-030. The Lambda image installs only `serve`.
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
ingest = [
    "pillow>=13.0.0",
    "pypdf>=6.21.4",
    "pypdfium2>=5.15.2",
]
eval = []
serve = [
    "bm25s==0.3.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/madhya_kanoon_saathi"]

[tool.uv]
default-groups = ["dev", "ingest", "serve"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# tests quote real lines of statute text verbatim (with typographic quotes and dashes)
"tests/**" = ["E501", "RUF001", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# pypdfium2 (v5.15.2, 2026-11-10) and bm25s (v0.3.16, 2026-11-11) ship no type stubs or py.typed marker
module = ["pypdfium2", "pypdfium2.*", "bm25s", "bm25s.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not paid'"
markers = [
    "slow: long-running tests (models, full index builds)",
    "paid: calls a paid API (Sarvam, Bedrock); skipped unless run with -m paid",
    "golden: checks against golden-set rows",
]
