# Hook revisions checked with `git ls-remote --tags` on 2026-11-06.
# ruff rev matches the ruff version in uv.lock (0.17.3).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # `gitleaks` builds with Go (language: golang). If pre-commit can't bootstrap Go on Windows,
      # switch to `gitleaks-docker` (Docker is installed). TODO(verify) — OPEN_QUESTIONS M5.
      - id: gitleaks
